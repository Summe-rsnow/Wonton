name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install nsh
        shell: pwsh
        env:
          NSH_VERSION: v0.6.1
        run: |
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:LOCALAPPDATA\nsh\bin\nsh.exe" --version

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y

      - name: Package Windows installer
        shell: pwsh
        run: nsh package --target windows

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .nsh/out/*.exe
            .nsh/out/*.zip
          generate_release_notes: true
