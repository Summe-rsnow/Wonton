[package]
name = "nsh-app-wonton"
version = "1.1.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Summe-rsnow/Wonton"
publish = false

[workspace]

[dependencies]
nsh-core = { version = "0.6.0", features = ["svg"] }
nsh-base = { version = "0.6.0", default-features = false }
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"
ring = "0.17"
ureq = { version = "3.5", default-features = false, features = ["rustls", "socks-proxy"] }

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.6.0", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.6.0", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.6.0", default-features = false, features = ["svg"] }

[dev-dependencies]
nsh-engine = "0.6.0"
nsh-testing = { version = "0.6.0", features = ["live"] }
